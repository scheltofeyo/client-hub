[build]
  command = "npm run build && npm run seed"
  publish = ".next"

# A synchronous Netlify Function that outlives its timeout is killed by the
# platform, and the caller gets a bare 502 Bad Gateway instead of anything this
# app wrote — so the timeout is the real budget every request lives inside.
# Left implicit it is 10s, which a cold function plus a cold Atlas dial can eat
# on its own. 26s is the synchronous maximum; Netlify has to enable it per site
# (Support > "raise function timeout"), and until they do this value is capped
# back to 10s rather than rejected, so it is safe to commit ahead of the ask.
#
# This is a floor, not a licence: anything genuinely slow (the proposal PDF
# render) needs a background function, not a bigger number here.
[functions]
  timeout = 26

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Local plugin: pings the keep-warm endpoint right after a production deploy
# goes live, so the first real user doesn't pay the cold function + cold Atlas
# dial. Steady-state warmth is handled by netlify/functions/warmup.mts.
[[plugins]]
  package = "/plugins/warmup-on-deploy"
